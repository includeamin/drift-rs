[package]
name = "drift"
version = "0.12.0"
edition = "2021"
rust-version = "1.70"
description = "Calculate RFC 6902 JSON Patch operations between structured documents"
license = "MIT"

[lib]
name = "drift"
path = "src/lib.rs"

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
