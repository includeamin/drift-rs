[workspace]
members = [".", "web"]

[package]
name = "drift"
version = "0.15.0"
edition = "2021"
rust-version = "1.70"
description = "Calculate RFC 6902 JSON Patch operations between structured documents"
license = "MIT"

[lib]
name = "drift"
path = "src/lib.rs"

[[bin]]
name = "drift"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
toml = { version = "0.8", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
pretty_assertions = "1"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "performance"
harness = false
