[package]
name = "drift-wasm"
version = "0.16.0"
edition = "2021"
description = "WebAssembly bindings powering the drift browser demo"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drift = { path = "..", default-features = false, features = ["yaml", "toml", "xml"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
