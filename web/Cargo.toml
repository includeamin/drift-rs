[package]
name = "drift-wasm"
version = "0.23.0"
edition = "2021"
description = "WebAssembly bindings powering the drift browser demo"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
drift = { path = "..", default-features = false, features = ["yaml-comments", "toml", "xml"] }
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"

[dev-dependencies]
drift = { path = "..", default-features = false, features = ["yaml-comments", "toml", "xml", "csv"] }
