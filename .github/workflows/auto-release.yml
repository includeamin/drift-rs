name: Automated Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/lib.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    name: Check if Release is Needed
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      new_version: ${{ steps.check.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for conventional commits
        id: check
        shell: bash
        run: |
          set -euo pipefail
          
          # Get current version
          current_version=$(grep '^version' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Current version: $current_version"
          
          # Check for commits since last tag
          # --abbrev=0 is required: without it describe returns "v1.2.3-9-gabc1234",
          # which git resolves back to HEAD, making the range below empty.
          last_tag=$(git describe --tags --abbrev=0 --match "v*" 2>/dev/null || echo "")
          
          if [ -z "$last_tag" ]; then
            log_range="HEAD"
            echo "No previous tags found"
          else
            log_range="${last_tag}..HEAD"
            echo "Commits since $last_tag"
          fi
          
          # Get commit log
          commit_log=$(git rev-list --pretty=%B $log_range 2>/dev/null || echo "")
          
          # Check for conventional commits
          has_breaking=$(echo "$commit_log" | grep -q "^BREAKING CHANGE:" && echo "true" || echo "false")
          has_feat=$(echo "$commit_log" | grep -qE "^feat(\(.+\))?!?:" && echo "true" || echo "false")
          has_fix=$(echo "$commit_log" | grep -qE "^fix(\(.+\))?!?:" && echo "true" || echo "false")

          echo "breaking=$has_breaking feat=$has_feat fix=$has_fix"
          
          # Determine version bump
          if [ "$has_breaking" = "true" ]; then
            major=$(echo "$current_version" | cut -d. -f1)
            new_version="$((major + 1)).0.0"
          elif [ "$has_feat" = "true" ]; then
            major=$(echo "$current_version" | cut -d. -f1)
            minor=$(echo "$current_version" | cut -d. -f2)
            new_version="$major.$((minor + 1)).0"
          elif [ "$has_fix" = "true" ]; then
            major=$(echo "$current_version" | cut -d. -f1)
            minor=$(echo "$current_version" | cut -d. -f2)
            patch=$(echo "$current_version" | cut -d. -f3)
            new_version="$major.$minor.$((patch + 1))"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "new_version=$new_version" >> "$GITHUB_OUTPUT"

  release:
    name: Create Release and Tag
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Update version in Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          new_version="${{ needs.check-release.outputs.new_version }}"
          sed -i "s/^version = .*/version = \"$new_version\"/" Cargo.toml

      - name: Update version in lib.rs
        shell: bash
        run: |
          set -euo pipefail
          new_version="${{ needs.check-release.outputs.new_version }}"
          sed -i "s/pub const VERSION: &str = .*/pub const VERSION: \&str = \"$new_version\";/" src/lib.rs

      - name: Sync Cargo.lock
        shell: bash
        # Updates the workspace member version only; third-party deps stay pinned.
        run: cargo update --workspace

      - name: Generate changelog
        shell: bash
        run: |
          set -euo pipefail
          new_version="${{ needs.check-release.outputs.new_version }}"
          
          # Create changelog entry
          {
            echo "# Changelog"
            echo ""
            echo "## [$new_version] - $(date +%Y-%m-%d)"
            git log --pretty=format:"- %s" v0.0.0..HEAD 2>/dev/null | sort -u || echo "- Release $new_version"
            echo ""
          } > CHANGELOG.md.tmp
          
          if [ -f CHANGELOG.md ]; then
            tail -n +2 CHANGELOG.md >> CHANGELOG.md.tmp 2>/dev/null || true
          fi
          mv CHANGELOG.md.tmp CHANGELOG.md

      - name: Verify build
        shell: bash
        # Matches release.yml so a stale lock fails here, not after tagging.
        run: cargo build --locked

      - name: Create release commit and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          new_version="${{ needs.check-release.outputs.new_version }}"
          tag="v$new_version"
          
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          if [ -n "$(git status --porcelain)" ]; then
            git add Cargo.toml Cargo.lock src/lib.rs CHANGELOG.md
            git commit -m "chore(release): bump to $new_version"
            git push origin main
          fi
          
          git tag -a "$tag" -m "Release $tag" || git tag -f -a "$tag" -m "Release $tag"
          git push origin "$tag" --force || git push origin "$tag"
